[project]
name = "data-science"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.12"
# Runtime deps only — what the API (api -> predict -> preprocessing) actually imports.
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "transformers>=5.10.2",
    "torch>=2.12.0",
    "spacy>=3.8.14",
    "nltk>=3.9.4",
    "pydantic>=2.13.4",
    "pandas>=3.0.3",
]

# Training-only deps — not installed in the runtime image.
# Install locally with: uv sync --group training
[dependency-groups]
training = [
    "scikit-learn>=1.9.0",
    "joblib>=1.5.3",
]

# Pull CPU-only torch wheels (no CUDA) — ~2GB smaller image, faster build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }